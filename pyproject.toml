[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentic-rag-postgres-mcp"
version = "0.1.0"
description = "Agentic RAG with PostgreSQL, pgvector, LangGraph, and MCP"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Jayanth Lokam" }]
dependencies = [
  "alembic>=1.15,<2",
  "asyncpg>=0.30,<1",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "groq>=0.11,<1",
  "httpx>=0.28,<1",
  "langchain-core>=1.0,<2",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3.0,<4",
  "mcp>=1.28.1,<2",
  "openai>=1.100,<3",
  "pgvector>=0.4,<1",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.9,<3",
  "pyjwt>=2.10,<3",
  "pypdf>=5.6,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "sentence-transformers>=3.0,<4",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
frontend = ["streamlit>=1.50,<2"]

[dependency-groups]
dev = [
  "aiosqlite>=0.21,<1",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.26,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend", "frontend", "scripts"]
plugins = ["pydantic.mypy"]
